name = "frugal-hub"
main = "worker.js"
compatibility_date = "2026-04-01"

# ⚠️  BINDING ALIGNMENT (2026-04-18):
#   The worker NAME stays `frugal-hub` because the *.workers.dev URL routes
#   from it (clients install against mooter-hub.frugal-hub.workers.dev).
#   But the D1 + R2 bindings point at the `mooter-hub` tier resources,
#   created 2026-04-13 when the brand migrated. The previous config pointed
#   at the legacy `frugal-hub` D1 (empty since migration) — the deployed
#   worker had been Dashboard-edited to the mooter-hub D1, which meant any
#   `wrangler deploy` from CI (using this toml) would silently revert the
#   binding and kill fleet telemetry on next push to hub/**. This commit
#   closes that drift.

[[d1_databases]]
binding = "DB"
database_name = "mooter-hub"
database_id = "3659b56e-6f9c-4da8-bc28-e9f79b8576f7"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "mooter-hub-storage"

[triggers]
crons = ["0 * * * *", "0 6 * * *", "0 6 * * 1"]
# hourly: aggregate deltas
# daily 06:00 UTC: generate router-tuning
# weekly Monday 06:00 UTC: notify Paulo + prune old deltas

[vars]
DELTA_TTL_DAYS = "7"
MIN_TRUST_SCORE = "0.4"
NEW_MODEL_THRESHOLD = "10"
ACCURACY_DROP_THRESHOLD = "0.15"
# Sprint 8.3 — Sentry. Leave empty here to ship a build without telemetry.
# For production: `wrangler secret put SENTRY_DSN` keeps it out of git.
# The worker no-ops when this is empty.
SENTRY_DSN = ""
SENTRY_ENVIRONMENT = "production"
SENTRY_RELEASE = "mooter-hub@0.1.0"
