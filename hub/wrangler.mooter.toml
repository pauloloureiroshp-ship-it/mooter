# ✅ CANONICAL hub config (Wave 13.x brand cleanup, 2026-06-04).
# Worker `mooter-hub` serves the client URL mooter-hub.frugal-hub.workers.dev,
# which every installed CLI is hardcoded against. CI (.github/workflows/deploy-hub.yml)
# deploys THIS config. The legacy `frugal-hub` Worker (wrangler.frugal-legacy.toml)
# is deprecated/frozen. Both share the same mooter-hub D1 + R2 bindings.
name = "mooter-hub"
main = "worker.js"
compatibility_date = "2026-04-01"
# Sprint 8.3: @sentry/cloudflare imports node:async_hooks.
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mooter-hub"
database_id = "3659b56e-6f9c-4da8-bc28-e9f79b8576f7"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "mooter-hub-storage"

# [triggers]
# crons deferred — Free plan limit reached (frugal-hub uses 3/5).
# Re-enable after frugal-hub crons are removed in Phase 4.
# crons = ["0 * * * *", "0 6 * * *", "0 6 * * 1"]

[vars]
DELTA_TTL_DAYS = "7"
MIN_TRUST_SCORE = "0.4"
NEW_MODEL_THRESHOLD = "10"
ACCURACY_DROP_THRESHOLD = "0.15"
# Sprint 8.3 — Sentry. Use `wrangler secret put SENTRY_DSN -c wrangler.mooter.toml`.
SENTRY_DSN = ""
SENTRY_ENVIRONMENT = "production"
SENTRY_RELEASE = "mooter-hub@0.1.0"
