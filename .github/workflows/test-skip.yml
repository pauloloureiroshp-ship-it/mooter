# test-skip.yml — o par obrigatório do `test.yml`.
#
# A causa que este ficheiro existe para matar, medida a 2026-08-18:
#
#   `test.yml` tem um filtro `paths:` (tools/router/**, packages/cli/**, …).
#   A `main` passou a exigir `unit + integration tests` e `packages/cli unit
#   tests` como required status checks. Um PR que só toca em `README.md` não
#   dispara o `test.yml` — logo esses dois contextos NUNCA reportam — logo o PR
#   fica `BLOCKED` para sempre. Não é lentidão: é impossibilidade.
#
#   O primeiro PR a bater nisto foi o #283, um fix de uma linha no README.
#
# O padrão documentado do GitHub para conciliar `paths:` com required checks é
# este: um workflow gémeo com `paths-ignore` complementar e jobs com o MESMO
# `name:`, que reportam sucesso imediato. Para o GitHub, o contexto existe e
# passou; para nós, não se correu uma suite sobre código que ninguém tocou.
#
# ⚠️ Os `paths-ignore` daqui TÊM de espelhar exactamente os `paths` do
# `test.yml`. Se os dois divergirem, ou um PR fica bloqueado outra vez, ou
# passa sem correr os testes que devia — e a segunda é pior.
name: test

on:
  pull_request:
    branches: [main]
    paths-ignore:
    # ESPELHO EXACTO do `paths:` do test.yml — não uma lista à parte.
    #
    # O `paths-ignore` só salta a workflow quando TODOS os ficheiros alterados
    # casam. Se este espelho tiver menos padrões do que o `paths:` do test.yml,
    # um PR que toque num dos que faltam faz correr os DOIS — e ficam dois check
    # runs com o mesmo nome obrigatório, um deles verde sem ter corrido nada.
    #
    # Medido a 2026-09-01: a referência tinha 13 padrões e este espelho 7. Um PR
    # a `tools/ab/**` disparava os dois. A deriva é silenciosa — cada padrão novo
    # no test.yml nasce em falta aqui — por isso há um teste que exige o espelho:
    # `tools/cockpit/runner/workflows-parseiam.test.mjs`.
      - 'tools/router/**'
      - 'packages/cli/**'
      - 'packages/mooter-bridge/**'
      - 'tools/cockpit/**'
      - 'tools/verify/**'
      - 'tools/gauntlet/**'
      - 'tools/ab/**'
      - 'tools/handoff-preflight*'
      - 'AGENTS.md'
      - 'docs/strategy/PERFECT_HANDOFF_SPEC.md'
      - 'packages/slack-spike/**'
      - 'tools/guarda-home*'
      - '.github/workflows/**'

jobs:
  unit:
    name: unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Nada a testar neste PR
        run: echo "Este PR não toca em nenhum path vigiado pelo test.yml — nada a correr."

  cli-test:
    name: packages/cli unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Nada a testar neste PR
        run: echo "Este PR não toca em packages/cli — nada a correr."
