name: Version Sync

# Keeps tools/router/version.json in sync with release tags so `mooter --version`
# and install.sh never drift behind the shipped tag (root cause: version.json sat
# at 1.6.0 while tags reached 1.21.x). On a `vX.Y.Z[-suffix]` tag push, derive the
# semver core (strip leading `v` and any `-suffix`) and write it back to the
# default branch. Self-guarding: commits with [skip ci] and only when changed.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  # necessario desde 2026-08-29: o sync deixou de empurrar para `main` (proteccao
  # de ramo) e passou a abrir um PR. Sem isto o `gh pr create` leva 403.
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Derive semver core from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          CORE="${TAG#v}"        # strip leading v
          CORE="${CORE%%-*}"     # strip first -suffix onward
          if ! printf '%s' "$CORE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' does not yield a clean semver core ('$CORE') — skipping." >&2
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$CORE" >> "$GITHUB_OUTPUT"

      # Writes BOTH version.json files. landing/app/version.json is a build-time
      # copy (Next.js can only import from inside the app root, so the landing
      # cannot read tools/router/version.json directly) — but a copy nobody syncs
      # is just a lie with a timestamp. It sat at 1.39.0 while the router shipped
      # 1.44.0, so the public site advertised a version 5 minors stale. Both are
      # derived from the tag here; neither is ever hand-edited.
      - name: Update version.json (router + landing)
        if: steps.ver.outputs.skip != '1'
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const today = new Date().toISOString().slice(0, 10);
            // packages/mooter-bridge/version.json entrou a 2026-08-18: a tag
            // v1.49.0 foi escolhida PRECISAMENTE por alinhar os tres numeros, e
            // a v1.49.1 desalinhou-os logo a seguir (landing e router foram a
            // 1.49.1, o bridge ficou em 1.49.0) porque ele nao estava nesta
            // lista. Um ficheiro que so bate por acaso e uma mentira a espera
            // da proxima tag.
            const targets = [
              "tools/router/version.json",
              "landing/app/version.json",
              "packages/mooter-bridge/version.json",
              // O manifest e o que da o NOME e a versao ao .mcpb que vai para os
              // utilizadores (`pack-mcpb.mjs` le `manifest.version`). Ficou fora
              // ate 2026-08-18: uma release da v1.49.1 teria publicado um bundle
              // chamado `mooter-v1490.mcpb`, rotulado 1.49.0 — um quarto numero
              // fora de passo, no unico ficheiro que o utilizador chega a ver.
              "packages/mooter-bridge/manifest.json",
              // O quinto. `versao-coerente.test.js` JA exigia que este batesse com o
              // manifest — e foi esse teste que apanhou o bump manual de 2026-08-18.
              // Um par guardado por um teste mas nao pela automacao e um par que
              // so se mantem enquanto alguem se lembrar.
              "plugin/mooter/.claude-plugin/plugin.json",
            ];
            for (const p of targets) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              if (j.version === v) { console.log(p + " already " + v + " — no change"); continue; }
              j.version = v;
              // Only the router manifest carries a release date; the landing copy
              // is a mirror of the version string alone.
              if ("released" in j) j.released = today;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
              console.log("Bumped " + p + " → " + v);
            }
          '
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Commit back if changed
        if: steps.ver.outputs.skip != '1'
        run: |
          if git diff --quiet -- tools/router/version.json landing/app/version.json packages/mooter-bridge/version.json packages/mooter-bridge/manifest.json plugin/mooter/.claude-plugin/plugin.json; then
            echo "No version.json change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/router/version.json landing/app/version.json packages/mooter-bridge/version.json packages/mooter-bridge/manifest.json plugin/mooter/.claude-plugin/plugin.json
          git commit -m "chore(release): sync version.json → ${{ steps.ver.outputs.version }} [skip ci]"
          # main may have advanced between the tag push and this job — rebase before
          # pushing so a racing commit doesn't cause a non-fast-forward failure.
          git pull --rebase origin main
          # ⚠️ 2026-08-29 — este passo empurrava DIRECTO para `main` e passou a
          # falhar em TODAS as tags no momento em que a proteccao de ramo com
          # checks obrigatorios entrou. Medido na v1.51.0 (run 33164279461): o
          # commit era construido bem — "3 files changed" — e o push levava
          # `GH006: Protected branch update failed ... 5 of 5 required status
          # checks are expected`. Resultado silencioso: a release v1.51.0 foi
          # publicada com os cinco ficheiros a dizer 1.50.0, incluindo o
          # `manifest.json` que da o nome e o rotulo ao .mcpb que o utilizador
          # instala. O gate que existe para impedir deriva de versao era, ele
          # proprio, a fonte da deriva.
          #
          # O GITHUB_TOKEN nao pode contornar a proteccao (e e bom que nao possa).
          # Entao deixa de tentar: abre um PR, que e o caminho que a proteccao
          # preve. Falhar a abrir o PR continua a falhar o job — um sync de
          # versao que se cala e como nao existir.
          BRANCH="chore/version-sync-${{ steps.ver.outputs.version }}"
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(release): sync version.json → ${{ steps.ver.outputs.version }}" \
            --body "Aberto automaticamente pelo workflow \`Version Sync\` na tag \`${{ github.ref_name }}\`.

Alinha os cinco ficheiros de versao com a tag publicada:
\`tools/router/version.json\` · \`landing/app/version.json\` ·
\`packages/mooter-bridge/version.json\` · \`packages/mooter-bridge/manifest.json\` ·
\`plugin/mooter/.claude-plugin/plugin.json\`.

O \`manifest.json\` e o que da o nome e o rotulo ao \`.mcpb\` que o utilizador
instala — sem este merge, a release publica um bundle rotulado com a versao anterior." \
            || echo "PR ja existe para ${BRANCH} — nada a abrir."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
