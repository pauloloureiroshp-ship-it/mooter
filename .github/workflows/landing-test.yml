name: landing-test

# Phase C.1 / F-3 — the landing/dashboard/admin vitest suite (incl. the
# admin email-masking privacy guard and the honesty/Demo-fallback logic)
# previously ran in NO workflow, while Vercel auto-deploys from `main`.
# This gates the showcase-facing surface on every PR + push that touches it.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      # A rota /api/admin/matrix le o seed e o snapshot de precos REAIS de
      # `data/` (ver route.test.ts). Sem esta linha, um PR que so mexa em
      # `data/` nao acorda esta suite: foi assim que o #398 precificou o
      # claude-fable-5 e partiu o teste de cobertura de TES em `main` sem
      # nenhum check vermelho no proprio PR.
      - 'data/**'
      - '.github/workflows/landing-test.yml'
  pull_request:
    # 2026-09-11 — este `branches:` NAO esta aqui.
    #
    # Estava, e dizia `[main]`. Num `pull_request`, esse filtro e sobre a BASE do
    # PR — nao sobre o branch de trabalho. Consequencia medida nesse dia: os PRs
    # #492, #493, #496 e #497, empilhados uns sobre os outros (base
    # `feat/onboarding-v2-w*`), NUNCA dispararam esta workflow. Apareciam com 9
    # checks verdes — `ratchet`, `segredos`, Vercel — e nenhum deles era uma
    # suite. Comparacao: o #491, com base `main`, teve 15.
    #
    # Pior: um teste que apanha um defeito REAL (o espelho do `test-skip.yml`
    # partido pelas W2/W3) estava vermelho localmente e nunca reprovou em PR
    # nenhum, porque a workflow que o corre nao chegava a arrancar.
    #
    # O trabalho empilhado e um padrao normal, nao uma excepcao — e uma CI que
    # so ve PRs para `main` e cega exactamente quando ha mais codigo por rever de
    # uma vez. Sem `branches:`, esta workflow corre em qualquer PR; os `paths:`
    # abaixo continuam a decidir SE ha algo a correr.
    paths:
      - 'landing/**'
      - 'data/**'
      - '.github/workflows/landing-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: landing vitest + typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install landing dependencies
        working-directory: landing
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        working-directory: landing
        run: npm run typecheck

      - name: Lint
        working-directory: landing
        run: npm run lint

      - name: Test (vitest run)
        working-directory: landing
        run: npm run test
