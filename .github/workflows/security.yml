name: security

# Wave 30 Phase I — supply-chain gate. Blocks merge on any HIGH/critical npm
# advisory; moderates are tracked (audit/NPM_AUDIT_BASELINE.md), not blocking.
# Also runs the validation package's threat-model runtime probes.

on:
  pull_request:
    # 2026-09-11 — este `branches:` NAO esta aqui.
    #
    # Estava, e dizia `[main]`. Num `pull_request`, esse filtro e sobre a BASE do
    # PR — nao sobre o branch de trabalho. Consequencia medida nesse dia: os PRs
    # #492, #493, #496 e #497, empilhados uns sobre os outros (base
    # `feat/onboarding-v2-w*`), NUNCA dispararam esta workflow. Apareciam com 9
    # checks verdes — `ratchet`, `segredos`, Vercel — e nenhum deles era uma
    # suite. Comparacao: o #491, com base `main`, teve 15.
    #
    # Pior: um teste que apanha um defeito REAL (o espelho do `test-skip.yml`
    # partido pelas W2/W3) estava vermelho localmente e nunca reprovou em PR
    # nenhum, porque a workflow que o corre nao chegava a arrancar.
    #
    # O trabalho empilhado e um padrao normal, nao uma excepcao — e uma CI que
    # so ve PRs para `main` e cega exactamente quando ha mais codigo por rever de
    # uma vez. Sem `branches:`, esta workflow corre em qualquer PR; os `paths:`
    # abaixo continuam a decidir SE ha algo a correr.
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - 'packages/**'
      - 'hub/**'
      - 'tools/router/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (block on HIGH)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every package with a lockfile that ships, installs, or tests code
        # blocks on HIGH. `landing` was audited separately (non-blocking) from
        # 2026-06-07 to 2026-09-13 because its Next.js toolchain carried
        # pre-existing HIGH advisories; that carve-out ended the day the same
        # `next` line turned out to hold two unauthenticated-RCE criticals
        # (#513 closed the runtime, this change closed the vitest toolchain).
        # `packages/router` joined on 2026-09-11 (#489 follow-up): it was the one
        # package the CLI bundle inlines from and nobody audited — it carried
        # 3 HIGH nodes (fast-uri, thrift, @dsnp/parquetjs) invisibly. A package
        # nobody audits is not green, it is invisible. `packs` joined the same
        # way minutes later, same day (#501 follow-up): js-yaml 4.1.1 sat inside four
        # advisories there, unaudited, while the same package was being fixed
        # everywhere else. The repo root ('.', the claude-agent-sdk anchor) and
        # `dashboard` joined last (#504 follow-up): the dashboard's next@15.5.15
        # sat inside two CRITICAL unauthenticated-RCE advisories, one of them
        # specifically for Windows-hosted servers — which is exactly how it runs.
        pkg: [tools/router, packages/cli, hub, packages/router, packs, '.', dashboard, landing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (HIGH+ from lockfile)
        working-directory: ${{ matrix.pkg }}
        run: |
          set +e
          npm audit --audit-level=high --package-lock-only
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            echo "::error::HIGH/critical vulnerability in ${{ matrix.pkg }} (npm audit exit $code)"
            exit 1
          fi
          echo "${{ matrix.pkg }}: no HIGH/critical advisories."

  threat-probes:
    name: validation threat-model probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install toolchain (tsx via @mooter/cli)
        working-directory: packages/cli
        run: npm ci --no-audit --no-fund
      - name: Run validation tests (incl. threat-model probes)
        working-directory: packages/validation
        run: npm test
