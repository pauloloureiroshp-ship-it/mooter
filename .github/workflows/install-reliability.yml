name: install-reliability

# Wave 8 gate: a fresh install must build the v1.0 CLI bundle and the shim must
# dispatch both v1 product commands AND legacy/installer commands. Prevents the
# regression where install.sh shipped only the legacy CLI (no feedback/forge).

on:
  push:
    branches: [main, dev]
    paths:
      - 'install.sh'
      - 'landing/public/install.sh'
      - 'packages/cli/**'
      - 'packages/router/src/classify_domain.ts'
      - '.github/workflows/install-reliability.yml'
      # Os sitios que declaram o piso de Node. Sem eles aqui, uma alteracao ao
      # install.ps1 ou a um runbook nunca dispararia o job que os verifica — o
      # mesmo buraco que o test.yml ja documenta no seu cabecalho ("adicionar
      # caminhos nunca torna o CI mais fraco: corre mais"). A lista e mantida
      # honesta por `piso-de-node.test.mjs`, que falha se SITIOS crescer e este
      # `paths:` nao acompanhar.
      - 'install.ps1'
      - 'landing/public/install.ps1'
      - 'package.json'
      - 'CONTRIBUTING.md'
      - 'tests/README.md'
      - 'docs/strategy/MOOTER_OPERATIONS.md'
      - 'docs/strategy/PASTOR_OPERATIONS.md'
      - 'tools/cockpit/runner/piso-de-node.mjs'
  pull_request:
    paths:
      - 'install.sh'
      - 'landing/public/install.sh'
      - 'packages/cli/**'
      - 'packages/router/src/classify_domain.ts'
      - '.github/workflows/install-reliability.yml'
      # Os sitios que declaram o piso de Node. Sem eles aqui, uma alteracao ao
      # install.ps1 ou a um runbook nunca dispararia o job que os verifica — o
      # mesmo buraco que o test.yml ja documenta no seu cabecalho ("adicionar
      # caminhos nunca torna o CI mais fraco: corre mais"). A lista e mantida
      # honesta por `piso-de-node.test.mjs`, que falha se SITIOS crescer e este
      # `paths:` nao acompanhar.
      - 'install.ps1'
      - 'landing/public/install.ps1'
      - 'package.json'
      - 'CONTRIBUTING.md'
      - 'tests/README.md'
      - 'docs/strategy/MOOTER_OPERATIONS.md'
      - 'docs/strategy/PASTOR_OPERATIONS.md'
      - 'tools/cockpit/runner/piso-de-node.mjs'
  workflow_dispatch:

jobs:
  fresh-install:
    name: fresh install builds + dispatches v1 CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O nome era "Setup Node 20". Sem numero no nome ele nao pode voltar a
      # mentir sobre a linha abaixo — e passa a haver so uma fonte da verdade,
      # que e o `node-version`. Verificado por `ci-coerencia.mjs`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22 como o resto do CI, e o Node 20 esta em EOL desde 2026-04-30.
          #
          # ATENCAO ao que este gate NAO prova, e nunca provou: o `install.sh:132`
          # diz ao utilizador "mooter needs Node 18+", mas o `build.mjs:24` compila
          # o bundle com `--target=node20`. Quem instalar em Node 18 ou 19 PASSA a
          # verificacao do instalador e recebe um bundle compilado para 20+. O gate
          # corria em 20: nem o piso declarado (18) nem o runtime da suite (22) —
          # um terceiro numero que nenhum ficheiro declara. Alinha-lo com a suite
          # nao perde cobertura do piso porque o piso nunca esteve coberto.
          # Fechar essa contradicao (subir o piso do install.sh, ou baixar o target
          # do esbuild) muda o que se recusa a utilizadores reais — decisao do dono,
          # nao deste commit.
          node-version: '22'

      - name: Build v1.0 CLI bundle (esbuild, zero-runtime-deps)
        run: |
          cd packages/cli
          npm install --no-audit --no-fund
          npm run build
          test -f mooter.js || { echo "::error::bundle mooter.js not produced"; exit 1; }

      - name: Bundle is self-contained + dispatches a v1 command
        run: |
          # No node_modules next to the bundle — proves it's standalone.
          # Wave 12 D1-2: `mooter feedback` is now anonymous (no login). Point it
          # at an unreachable hub so the command deterministically hits its own
          # anon error path — this proves the feedback command is bundled and
          # dispatches without coupling CI to live hub state / migration 010.
          # (capture + `|| true`: the anon error path exits non-zero, which would
          # trip the default `-eo pipefail` shell even when grep matches.)
          out="$(MOOTER_HUB_URL=http://127.0.0.1:1 node packages/cli/mooter.js feedback "ci" 2>&1 || true)"
          echo "$out" | grep -q "Could not reach the mooter hub" \
            || { echo "::error::v1 bundle did not dispatch feedback"; exit 1; }

      # Substitui o `diff install.sh landing/public/install.sh` que aqui estava.
      # Ele vigiava UM dos dois pares: o par .ps1 nunca foi verificado e tinha
      # drift real (2 linhas) quando isto foi escrito, a 2026-08-22. O verificador
      # cobre os dois pares E o piso de Node em todos os sitios que o repetem.
      - name: Installers stay in sync + one Node floor everywhere
        run: node tools/cockpit/runner/piso-de-node.mjs .

      - name: Fresh install + hybrid dispatch smoke
        run: |
          set -e
          printf '#!/bin/sh\necho claude-stub\n' | sudo tee /usr/local/bin/claude >/dev/null
          sudo chmod +x /usr/local/bin/claude
          mkdir -p "$HOME/.claude"
          bash install.sh
          export PATH="$HOME/.local/bin:$PATH"
          # v1 product commands → bundled CLI
          # Wave 12 D1-2: feedback is anonymous — force an unreachable hub so the
          # command deterministically reaches its anon path (see standalone step).
          fb="$(MOOTER_HUB_URL=http://127.0.0.1:1 mooter feedback "ci" 2>&1 || true)"
          echo "$fb" | grep -q "Could not reach the mooter hub" || { echo "::error::feedback (v1) dispatch failed"; exit 1; }
          mooter forge --help 2>&1   | grep -q "forge install"     || { echo "::error::forge (v1) dispatch failed"; exit 1; }
          mooter pack list 2>&1      | grep -q "animation-web"      || { echo "::error::pack list (v1 + MOOTER_PACKS_DIR) failed"; exit 1; }
          mooter adapter list 2>&1   | grep -q "No adapters"        || { echo "::error::adapter (v1) dispatch failed"; exit 1; }
          # legacy/installer commands → tools/cli
          mooter doctor 2>&1         | grep -q "mooter doctor"      || { echo "::error::doctor (legacy) dispatch failed"; exit 1; }
          echo "✓ fresh install: v1 product + legacy commands dispatch correctly"
