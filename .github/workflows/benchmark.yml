name: benchmark

# Wave 30 Phase F — MLWR (Mooter Locality Win Rate) regression gate.
#
# The FULL benchmark (24 tasks × 5 models × 3 runs) needs local Ollama + paid
# API keys, so it is NOT run on the GitHub runner — it runs locally via
# `mooter benchmark run` (Phase L) which commits audit/BENCHMARK_v2_CURRENT.json.
# This workflow runs the validation unit tests and, when a current artifact is
# present, enforces the regression gate (block merge if MLWR drops > 5pp) and
# posts/updates a single PR comment with the delta table.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/validation/**'
      - 'packages/synthesis/**'
      - 'tools/router/**'
      - 'audit/BENCHMARK_v2_*'
      - '.github/workflows/benchmark.yml'
  push:
    branches: [dev]
    paths:
      - 'packages/validation/**'
      - 'audit/BENCHMARK_v2_*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  mlwr-gate:
    name: MLWR regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The validation package shares the cli package's tsx (matches synthesis).
      - name: Install toolchain (tsx via @mooter/cli)
        working-directory: packages/cli
        run: npm ci --no-audit --no-fund

      - name: Validation unit tests
        working-directory: packages/validation
        run: npm test

      - name: MLWR regression gate
        id: gate
        run: |
          BASE=audit/BENCHMARK_v2_BASELINE.json
          CUR=audit/BENCHMARK_v2_CURRENT.json
          if [ ! -f "$CUR" ]; then
            {
              echo "<!-- mooter-benchmark-mlwr -->"
              echo "### 🐮 Mooter Benchmark — MLWR gate idle"
              echo ""
              echo "No \`audit/BENCHMARK_v2_CURRENT.json\` in this PR. Run \`mooter benchmark run\` locally to refresh the benchmark, then commit the artifact to enforce the gate."
            } > comment.md
            cat comment.md
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          packages/cli/node_modules/.bin/tsx packages/validation/src/ci/cli.ts gate "$BASE" "$CUR" 5 > comment.md
          code=$?
          set -e
          cat comment.md
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Post / update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('comment.md')) return;
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- mooter-benchmark-mlwr -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce gate
        if: steps.gate.outputs.skipped != 'true'
        run: |
          code="${{ steps.gate.outputs.code }}"
          if [ "$code" = "1" ]; then
            echo "::error::MLWR regression detected — merge blocked (> 5pp drop)."
            exit 1
          fi
          if [ "$code" = "2" ]; then
            echo "::error::benchmark gate usage error."
            exit 1
          fi
          echo "MLWR gate passed (code=$code)."
