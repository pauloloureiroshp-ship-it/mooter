name: no-frugal ratchet
# Kill Frugal W7 — the word "frugal" must never INCREASE in live code, and the
# baseline only ratchets down. History (docs/archive, CHANGELOG, migrations) is
# exempt by design: we do not rewrite the past, we protect the future.
on: [push, pull_request]
jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count frugal references in live code
        run: |
          COUNT=$(grep -rli frugal tools packages hub landing scripts 2>/dev/null | grep -v node_modules | wc -l)
          BASELINE=$(cat docs/rebrand/frugal-baseline.txt)
          echo "live-code files containing 'frugal': $COUNT (baseline: $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::frugal references INCREASED ($COUNT > $BASELINE). Revert or rename."
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::ratchet can be tightened: update docs/rebrand/frugal-baseline.txt to $COUNT"
          fi
