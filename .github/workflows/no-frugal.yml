name: no-frugal ratchet
# Kill Frugal W7 — the word "frugal" must never INCREASE in live code, and the
# PR/push head is compared with its merge-base. History outside the live-code
# scopes is exempt by design: we do not rewrite the past, we protect the future.
on: [push, pull_request]
jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove the ratchet rejects one added live-code file
        run: node --test .github/scripts/no-frugal-ratchet.test.js
      - name: Compare frugal references with the merge-base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/no-frugal-ratchet.js --base "$BASE_REF" --head HEAD
