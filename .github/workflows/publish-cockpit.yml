name: Publish cockpit extension
# Publishes packages/vscode-extension to the VS Code Marketplace (and Open VSX)
# when a tag like `cockpit-v0.8.0` is pushed, or via manual dispatch.
# Requires repo secrets: VSCE_PAT (required), OVSX_PAT (optional, for Open VSX).
on:
  push:
    tags: ['cockpit-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 e nao 20 — e aqui a mudanca nao e so higiene, porque o passo `Test`
          # abaixo corre `node --test` NESTE runtime. Ate 2026-08-22 os 1394
          # testes da extensao corriam num Node que a suite principal (`test.yml`,
          # Node 22) nunca exercitava, e a extensao era publicada logo a seguir.
          # Verificado antes de mudar: os mesmos testes passam 1393/1394 · 0 fail
          # em Node 24 local, portanto o 22 nao os quebra.
          node-version: '22'
      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: node --test src/*.test.js
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@latest publish -p "$VSCE_PAT"
      - name: Publish to Open VSX (optional)
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        run: npx --yes ovsx publish -p "$OVSX_PAT"
