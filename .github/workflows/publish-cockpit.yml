name: Publish cockpit extension
# Publishes packages/vscode-extension to the VS Code Marketplace (and Open VSX)
# when a tag like `cockpit-v0.8.0` is pushed, or via manual dispatch.
# Requires repo secrets: VSCE_PAT (required), OVSX_PAT (optional, for Open VSX).
on:
  push:
    tags: ['cockpit-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Install runtime deps BEFORE testing/packaging: the live-edit engine needs
      # @babel/parser both to pass `node --test` and to be bundled into the vsix.
      # Without this the test step fails on a fresh runner and the published vsix
      # would ship without its parser (live-edit broken in the marketplace build).
      - name: Install deps
        run: npm ci
      - name: Test
        run: node --test src/*.test.js
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@latest publish -p "$VSCE_PAT"
      - name: Publish to Open VSX (optional)
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        run: npx --yes ovsx publish -p "$OVSX_PAT"
