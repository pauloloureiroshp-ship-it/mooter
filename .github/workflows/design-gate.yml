name: design-gate

# PORQUÊ ISTO EXISTE
#
# O router emite recomendações e é obedecido 0,23% das vezes (7/3.026) porque é
# advisory. Um design system em prosa tem exactamente o mesmo destino. Por isso a
# ordem foi invertida: primeiro o portão, depois o token, só no fim a superfície.
# Se a onda acabar com superfícies bonitas e sem o check a morder no CI, falhou —
# mesmo que tudo pareça melhor.
#   (decisão 2026-08-27 · 20-decisions/2026-08-27-design-system-do-mooter-a-fonte-e-o-portao.md)
#
# O PORTÃO ESTÁ LIGADO NO LIMIAR PUBLICADO — e o caminho até aqui importa
#
# Durante a maior parte de 2026-08-27 este workflow NÃO corria
# `moo-design-check --ci`, e dizia-o em voz alta. A razão: o índice era **3,18**
# depois de o portão passar a medir a sério, e o limiar publicado era 8. Ligá-lo
# deixava o `main` vermelho de forma permanente — e um CI cronicamente vermelho
# aprende-se a ignorar, que é o destino exacto que o portão existe para evitar.
#
# A saída fácil era `MOO_LIMIAR=3`. A decisão de 27/08 proíbe-a por escrito: «os
# limiares sobem quando as verificações `n/d` passarem a medir — nunca por
# conveniência de uma onda». Por isso o limiar nunca se moveu, e o que mordia
# entretanto era só o ratchet («o índice nunca desce»).
#
# O índice chegou a **9,09**:  3,41 (inflacionado por uma verificação cega)
#                           →  3,18 (a linha de base honesta)
#                           →  5,68 (39 violações fechadas)
#                           →  6,36 (contraste reconciliado com a produção)
#                           →  8,18 (as superfícies a ler do gerado)
#                           →  9,09 (superfície pública sem um único claim)
#
# ⚠️ Podia dizer 10,00. Ao separar «publicar» de «mostrar a quem entrou», a
# verificação 3 saltou para a nota cheia — no mesmo minuto em que a régua mudou.
# Um dez assim não é um dez, e a decisão de 27/08 nomeia-o: os limiares sobem
# quando as verificações passam a medir, «nunca por conveniência de uma onda».
# A verificação 3 dá METADE enquanto houver 15 estimativas de poupança na shell
# autenticada. A outra metade fica presa até saírem, ou até o dono decidir que
# ficam — e nesse dia é uma linha, com a decisão escrita ao lado.
#
# Foi o trabalho que subiu até ao limiar, não o limiar que desceu até ao
# trabalho. O `--ci` está ligado no passo 4; o ratchet FICA no passo 5, porque a
# margem sobre o limiar é de 1,09 e uma verificação vale entre 0,5 e 2,0 pontos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Sem `paths:` de propósito. A verificação `numero-honesto` varre `landing/app`,
# `plugin/mooter`, `packages/mooter-bridge` e os READMEs; a `marca-unica` varre o
# repo inteiro à procura de SVGs. Um claim proibido não pede licença ao caminho
# que o introduziu. (É também a armadilha documentada em `test.yml`: um job
# REQUIRED com `paths:` que nunca dispara deixa o PR BLOCKED para sempre.)

concurrency:
  group: design-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portao:
    name: o portão do design
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── A DEPENDÊNCIA QUE ESTE JOB NÃO TINHA, E PORQUE PASSOU A TER ─────────
      #
      # Aqui dizia: «Zero dependências por desenho: `node --test` e `node` sobre
      # ficheiros do repo. Se um dia precisar de `npm ci`, isso é uma mudança de
      # desenho e deve doer aqui primeiro.»
      #
      # Doeu, e a resposta é esta. O `moo-visual-audit` é a ÚNICA peça do design
      # que precisa de um browser, e por isso a sua dependência vive isolada em
      # `design/tools/package.json` e em mais lado nenhum — o viés zero-dep do
      # repo mantém-se para todo o resto, e este job continua a correr o portão
      # estático sem instalar nada até chegar aqui.
      #
      # O que forçou a mudança: sem playwright, os 7 testes com browser
      # aparecem como salto — e um salto imprime-se a verde. Medido a
      # 2026-08-29 nesta máquina: escondido o pacote, `npm run test:design`
      # sai **0** com 7 mordidas por correr. A 2026-08-29
      # descobriu-se que `test:design` era uma lista escrita à mão sem o
      # `moo-visual-audit.test.mjs`: corriam 61 dos 72 testes. Corrigiu-se a
      # lista, e o resultado foi trocar «não corre» por «corre e salta» — que é
      # a mesma cegueira com melhor aspecto. As mordidas que provam que a escala
      # de raios DERIVA do token são exactamente as que saltavam.
      - name: Cache do browser do auditor visual
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('design/tools/package-lock.json') }}

      - name: O browser do auditor visual
        working-directory: design/tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 1 · O teste de mordida ANTES do portão.
      #
      # Esta ordem não é estética. A 2026-08-27 o portão dava `marca-unica`
      # 1,5/1,5 — «um só desenho» — com OITO cópias da vaca vivas no repo: `.svg`
      # não estava em `EXT_TEXTO`, o walker nunca devolvia um SVG, e o filtro
      # seguinte descartava 100% do que recebia. O ✅ não era uma medição; era a
      # ausência de medição vestida de medição. Um portão que nunca falhou é
      # indistinguível de um portão que não funciona, por isso o CI prova
      # primeiro que ele MORDE, e só depois acredita no número que ele dá.
      - name: O portão morde? (testes que plantam o defeito)
        run: |
          set -o pipefail
          npm run test:design 2>&1 | tee /tmp/design-tests.log

      # 1b · UM SALTO NÃO É UM VERDE.
      #
      # Sem esta verificação, apagar a instalação do browser acima devolvia o CI
      # ao estado anterior — verde, com as mordidas do auditor a não correrem — e
      # ninguém dava por isso, porque o passo acima sai 0 na mesma. É a lição de
      # `feedback_guarda_sem_teste_de_mordida` aplicada à própria guarda: o que
      # não corre tem de ser VISÍVEL, e aqui tem de ser FATAL.
      #
      # Se algum dia um salto for legítimo, o sítio de o declarar é aqui, com o
      # nome do teste e a razão — não um número que sobe em silêncio.
      - name: Nenhuma mordida foi saltada
        run: |
          saltados=$(grep -oE '^(#|ℹ) skipped [0-9]+' /tmp/design-tests.log | grep -oE '[0-9]+$' | tail -1)
          echo "saltados: ${saltados:-<não encontrado>}"
          if [ -z "$saltados" ]; then
            echo "::error::não consegui ler a contagem de saltos do relatório — a verificação não pode ser silenciosa"
            exit 1
          fi
          if [ "$saltados" != "0" ]; then
            echo "::error::$saltados teste(s) saltaram. Um SKIP imprime-se a verde e não mede nada — normalmente é o playwright em falta (design/tools). Corrige a instalação ou declara o salto aqui, com nome e razão."
            grep -iE 'skip|↓|﹣' /tmp/design-tests.log || true
            exit 1
          fi

      # 2 · Gerar, nunca copiar — provado, não afirmado.
      #
      # `moo-ui.css` e `moo-tokens.ts` são saída de `moo-tokens.json`. Editá-los
      # à mão é o defeito que a verificação 4 apanha. Aqui regenera-se e exige-se
      # árvore limpa: se alguém editou a saída, o `git diff` denuncia-o com o
      # ficheiro à vista, em vez de o esconder num índice agregado.
      #
      # (O `--check` do gerador também apanharia isto. O `git diff` é preferível
      # porque IMPRIME o que mudou.)
      - name: A saída é mesmo gerada
        run: |
          npm run design:build
          if ! git diff --quiet -- design/tokens/; then
            echo "::error::design/tokens/ diverge de moo-tokens.json — correr 'npm run design:build' e commitar."
            git diff --stat -- design/tokens/
            git diff -- design/tokens/
            exit 1
          fi
          echo "moo-ui.css e moo-tokens.ts idênticos ao que a fonte gera."

      # 2b · As cópias INLINE também são saída.
      #
      # Duas superfícies não podem importar — servidas por HTTP e empacotadas —
      # e trazem o bloco `:root` para dentro do próprio ficheiro. Enquanto isso
      # foi cópia manual, com um comentário a dizer "cópia verbatim", ficou velha
      # NO MESMO DIA: `papel.faint` passou de #9A8F7E (2,70:1) para #726859 e as
      # cópias mantiveram o valor velho. O auditor visual apanhou-o no sítio mais
      # irónico — o cartucho `MOOTER · COCKPIT · DES. 011`, o texto que
      # identifica a folha, ilegível a 2,70:1.
      #
      # O `design/README.md` diz que este pacote existe para tornar isso
      # impossível («o cockpit.html esteve 20 dias atrás precisamente por ser
      # cópia»). Uma cópia com um comentário a dizer que é cópia continua a ser
      # uma cópia; agora o bloco é ESCRITO, e este passo prova que está em dia.
      - name: As copias inline estao em dia
        run: npm run design:inline:ci

      # 3 · O token tem de continuar a ser o que a produção serve.
      #
      # O portão pontua contraste sobre `moo-tokens.json`. A 2026-08-27 mediu-se
      # que o JSON e o `globals.css` tinham divergido em 9 valores — e num deles
      # a divergência escondia um defeito a sério:
      #
      #     tinta.faint   token #7A7168 (4.13:1)  ·  produção #5A5249 (2.58:1)
      #
      # 2.58 está abaixo de AA-GRANDE (3.0), não só de AA. O portão dava a esse
      # par a nota do token, e as "correcções calculadas" que o JSON trazia tinham
      # sido calculadas sobre o valor errado.
      #
      # Reconciliados, token == produção e os 16 pares passam. Que é exactamente o
      # estado em que a PRÓXIMA regressão fica invisível: quem mexer só no CSS não
      # move o índice um milímetro. Este passo é o que fecha esse buraco.
      - name: O token e a produção não podem divergir
        run: npm run design:reconciliar:ci

      # 4 · O PORTÃO A SÉRIO, no limiar publicado.
      #
      # Este passo esteve desligado durante a maior parte de 2026-08-27, com a
      # razão escrita no cabeçalho: o índice era 3,18 e ligar `--ci` deixava o
      # `main` vermelho de forma permanente. Baixar `MOO_LIMIAR` estava proibido
      # por escrito. Liga-se agora porque o índice passou o limiar — 8,18 — e
      # não porque o limiar tenha vindo ao encontro do índice. Hoje: 9,09.
      - name: O portao, no limiar publicado
        run: npm run design:check:ci

      # 5 · E o ratchet FICA. O limiar de 8 e o chao; o ratchet impede que se
      # perca terreno DENTRO do verde — a margem sobre o limiar e de 1,09, e uma
      # verificacao vale 0,5 a 2,0 pontos. Sem ele, cair de 8,18 para 8,01 passava
      # despercebido.
      - name: O indice nao pode descer
        run: npm run design:ratchet:ci

      # 6 · O número, sempre visível — subiu ou não.
      #
      # `moo-design-check` já correu nos passos acima; isto reimprime o
      # relatório humano no log para que o índice apareça em toda a corrida, e
      # não só quando alguém abre o JSON.
      - name: Publicar o Índice de Coerência Visual
        run: npm run design:check

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-check
          path: |
            design/.design-check.json
            design/.design-baseline.json
          if-no-files-found: warn
