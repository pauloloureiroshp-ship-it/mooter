<head>

<style>
/* ============ tokens — dark default, light via prefers-color-scheme ============ */
:root{
  color-scheme: dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --text-1:#ffffff; --text-2:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,0.10);
  --s-moo:#3987e5;    /* slot 1 blue */
  --s-cc:#d95926;     /* slot 2 orange */
  --s-codex:#199e70;  /* slot 3 aqua */
  --s-kimi:#c98500;   /* slot 4 yellow */
  --s-gemini:#d55181; /* slot 5 magenta */
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --delta-good:#0ca30c;
  --seq-250:#86b6ef; --seq-600:#184f95;
  --meter-track:#184f95;
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --text-1:#0b0b0b; --text-2:#52514e; --text-muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,0.10);
    --s-moo:#2a78d6; --s-cc:#eb6834; --s-codex:#1baf7a; --s-kimi:#eda100; --s-gemini:#e87ba4;
    --delta-good:#006300;
    --seq-250:#86b6ef; --seq-600:#86b6ef;
    --meter-track:#cde2fb;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--text-1);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;}
body{min-width:340px;max-width:800px;margin:0 auto;padding:12px 14px 8px;}

/* ============ header ============ */
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:4px 2px 10px;}
header h1{font-size:16px;font-weight:600;letter-spacing:.01em;white-space:nowrap;}
.hdr-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);}
.hdr-meta .sep{color:var(--text-muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:3px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--ring);
  background:var(--surface-1);cursor:pointer;transition:opacity .25s;}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:none;}
.pill.live{color:var(--text-1)}
.pill.live .dot{background:var(--st-good);animation:pulse 1.6s ease-in-out infinite;}
.pill.snap .dot{background:var(--st-warn)}
.pill.snap{color:var(--text-1)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
#endpoint-row{display:none;width:100%;gap:6px;margin-top:2px;}
#endpoint-row.open{display:flex}
#endpoint-row input{flex:1;background:var(--surface-1);border:1px solid var(--ring);
  border-radius:6px;color:var(--text-1);padding:4px 8px;font:12px ui-monospace,monospace;}
#endpoint-row button{background:var(--surface-1);border:1px solid var(--ring);border-radius:6px;
  color:var(--text-2);padding:4px 10px;font-size:12px;cursor:pointer;}

/* ============ frota ============ */
.frota-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.frota-grid{grid-template-columns:1fr}}
.f-sub{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.f-row{font-size:12.5px;line-height:1.7;color:var(--text-1)}
/* ============ aprovações ============ */
.apr-card{border:1px solid var(--grid);border-radius:10px;padding:10px 12px;margin:10px 0;}
.apr-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.apr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn-ok,.btn-no{font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--grid);background:transparent;color:var(--text-1);cursor:pointer}
.btn-ok:not([disabled]):hover{border-color:var(--st-good)}
.btn-no:not([disabled]):hover{border-color:var(--st-serious,#c0392b)}
.btn-ok[disabled],.btn-no[disabled]{opacity:.45;cursor:not-allowed}
.chip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--grid);color:var(--text-2)}
/* ============ tabs ============ */
nav{display:flex;gap:2px;border-bottom:1px solid var(--grid);overflow-x:auto;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--text-2);
  text-decoration:none;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
  display:inline-flex;align-items:center;gap:5px;}
nav a:hover{color:var(--text-1)}
nav a.on{color:var(--text-1);border-bottom-color:var(--s-moo)}
nav .mini-badge{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--text-muted);
  border:1px solid var(--ring);border-radius:4px;padding:0 4px;line-height:1.5;}

/* ============ layout ============ */
main{padding:12px 0 4px}
.tabpane{display:none;animation:fadein .25s ease}
.tabpane.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.card{background:var(--surface-1);border:1px solid var(--ring);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;}
.card h2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:9px;}
.nd{color:var(--text-muted);font-style:normal}
.why{font-size:11.5px;color:var(--text-2)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
.tile{background:var(--surface-1);border:1px solid var(--ring);border-radius:8px;padding:9px 11px;}
.tile .lbl{font-size:11px;color:var(--text-2);margin-bottom:2px;}
.tile .val{font-size:22px;font-weight:600;line-height:1.15;}
.tile .val small{font-size:12px;font-weight:500;color:var(--text-2)}
.tile .sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
.tile .delta-good{color:var(--delta-good);font-size:12px;font-weight:600}

/* AGORA */
.agora{display:flex;align-items:center;gap:10px;}
.agora .beacon{width:12px;height:12px;border-radius:50%;flex:none;background:var(--text-muted);}
.agora.live .beacon{background:var(--st-good);animation:pulse 1.4s ease-in-out infinite;}
.agora .big{font-size:17px;font-weight:600}
.agora .det{font-size:12px;color:var(--text-2)}

/* meters */
.meter{height:10px;border-radius:5px;background:var(--meter-track);overflow:hidden;
  position:relative;margin:6px 0 4px;}
.meter .fill{height:100%;border-radius:5px 0 0 5px;background:var(--s-moo);
  transition:width .8s cubic-bezier(.2,.8,.2,1);}
.meter .fill.serious{background:var(--st-serious)}
.meter .fill.crit{background:var(--st-crit)}
.meter .fill.warn{background:var(--st-warn)}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-1);opacity:.85;}
.meter-cap{border-radius:5px}
.status-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);}
.status-line .ic{font-size:13px}

/* timeline de recibos */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:11.5px;color:var(--text-2);}
.legend .key{display:inline-flex;align-items:center;gap:5px;}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;}
.tl-row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;
  padding:4px 0;border-bottom:1px solid var(--grid);}
.tl-row:last-child{border-bottom:none}
.tl-meta{font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-track{position:relative;}
.tl-barwrap{display:flex;align-items:center;gap:8px;min-height:20px;}
.tl-bar{height:14px;border-radius:0 4px 4px 0;min-width:4px;flex:none;
  transition:width .8s cubic-bezier(.2,.8,.2,1);position:relative;}
.tl-bar.failed{background:transparent!important;border:none;

  outline:1px solid var(--st-crit);outline-offset:-1px;}
.tl-lab{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tl-lab b{color:var(--text-1);font-weight:600}
.badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.03em;

.badge.fail{color:var(--st-crit);border:1px solid var(--st-crit)}
.badge.cron{color:var(--text-muted);border:1px solid var(--ring)}
.axis-note{font-size:10.5px;color:var(--text-muted);margin-top:6px;border-top:1px solid var(--grid);padding-top:5px;}

.err-item:last-child{border-bottom:none}

  border-radius:4px;padding:1px 6px;border:1px solid;}
.sev.aberto{color:var(--st-serious);border-color:var(--st-serious)}
.sev.conhecido{color:var(--st-warn);border-color:var(--st-warn)}
.sev.resolvido{color:var(--st-good);border-color:var(--st-good)}
.err-item .tt{font-weight:600}
.err-item .dd{color:var(--text-2)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{font-size:11.5px;border:1px solid var(--ring);border-radius:999px;padding:2px 10px;
  color:var(--text-2);font-family:ui-monospace,monospace;}

/* gauntlet */
.gq{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:12.5px;align-items:baseline;}
.gq:last-child{border-bottom:none}
.gq .st-ic{flex:none;width:18px;text-align:center;}
.gq .q{color:var(--text-2)}
.gq .a{color:var(--text-1);font-weight:600}

/* proporção SYNC */
.prop-lab{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:2px;}

footer{border-top:1px solid var(--grid);margin-top:6px;padding:9px 2px 6px;
  font-size:10.5px;color:var(--text-muted);line-height:1.5;}

@media (max-width:430px){
  .tl-row{grid-template-columns:1fr}
  .tl-meta{padding-bottom:1px}
}
</style>

const nd  = (why) => `<span class="nd">n/d</span>${why?` <span class="why">— ${esc(why)}</span>`:""}`;
const fmtDur = s => s==null ? null : (s>=60 ? Math.round(s/60)+"m"+(s%60? (s%60)+"s":"") : s+"s");
const fmtDate = iso => { try{ const d=new Date(iso); return d.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"});}catch(e){return iso;} };

let RUNNER_ON = false;
async function togglePlay(){
  const b = document.getElementById("btn-play");
  try {
    const r = await fetch(ENDPOINT.replace(/\/fleet\.json$/,"") + (RUNNER_ON ? "/stop" : "/play"), {method:"POST"});
    if(!r.ok) throw new Error(r.status);
    RUNNER_ON = !RUNNER_ON;
    b.textContent = RUNNER_ON ? "⏸ stop" : "▶ play";
    b.title = RUNNER_ON ? "runner drenando filas dos pilares na GPU local ($0) — ⏸ para tudo (STOP no motor)" : "▶ liga o runner local (POST /play)";
  } catch(e){ b.title = "play falhou: endpoint sem /play (F10 pendente) — " + e; }
}
function syncPlayBtn(){
  const b = document.getElementById("btn-play");
  if(MODE === "live"){ b.disabled = false; b.style.cursor = "pointer"; b.onclick = togglePlay;
    if(b.title.includes("desabilitado")) b.title = "▶ liga o runner local (POST /play) — jobs bounded por pilar na GPU, $0 de tokens";
  } else { b.disabled = true; b.style.cursor = "not-allowed"; b.onclick = null; }
}
function renderPill(){
  syncPlayBtn();
  const pill = document.getElementById("src-pill");
  const txt  = document.getElementById("src-pill-txt");
  if(MODE==="live"){
    pill.className = "pill live";
    txt.textContent = "VIVO · $0";
    pill.title = "Dados vivos de "+ENDPOINT+" (poll 5 s). Clique para editar o endpoint.";
  }else{
    pill.className = "pill snap";
    txt.textContent = "SNAPSHOT · "+fmtDate(DATA.snapshot_em)+" · endpoint offline (F10 pendente)";

  }
}

function aprovarProposta(id, acao){
  const base = ENDPOINT.replace(/\/fleet\.json$/,"");
  fetch(base + "/" + acao, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id})})
    .then(r => { if(!r.ok) throw new Error(r.status); renderAll(); })
    .catch(e => { const el = document.getElementById("apr-msg-"+id); if(el) el.textContent = "endpoint sem /"+acao+" (F11 pendente) — decisao continua tua, no digest"; });
}
function renderAprovar(d){
  const pane = document.getElementById("pane-aprovar");
  const props = d.propostas || [];
  document.getElementById("apr-count").textContent = props.length ? String(props.length) : "";
  const live = (MODE === "live");
  pane.innerHTML = '<div class="card"><div class="card-t">✋ Fila de aprovação do MEO <span class="muted">· ' + props.length + ' proposta(s) · FSM drafted→approved · aprovar aplica em branch do pilar, NUNCA merge</span></div>' +
    (props.length === 0 ? '<p class="muted">Fila vazia. As propostas nascem dos moos locais (charter + gauntlet) quando o runner estiver vivo (F2/F11).</p>' : '') +
    props.map(p => (
      '<div class="apr-card" id="apr-'+p.id+'">' +
      '<div class="apr-head"><span class="chip">'+p.pilar+'</span> <strong>'+p.titulo+'</strong> <span class="mini-badge">'+p.fsm+'</span></div>' +
      '<p>'+p.texto+'</p>' +
      '<p class="muted">📎 evidência: '+p.evidencia+' · reversível: '+(p.reversivel?"sim":"NÃO — só gate humano")+' · custo: '+p.custo+' · destino: '+p.destino+'</p>' +
      '<div class="apr-actions">' +
      '<button class="btn-ok" '+(live?'':'disabled title="modo SNAPSHOT — o clique vivo chega com F11; hoje a decisão vai no digest/CC"')+' onclick="aprovarProposta(\''+p.id+'\',\'aprovar\')">✅ aprovar</button>' +
      '<button class="btn-no" '+(live?'':'disabled title="modo SNAPSHOT — F11 pendente"')+' onclick="aprovarProposta(\''+p.id+'\',\'rejeitar\')">❌ rejeitar (motivo vira dataset)</button>' +
      '<span class="muted" id="apr-msg-'+p.id+'"></span></div></div>'
    )).join('') +
    '<p class="muted" style="margin-top:10px">Regra: aprovar = evento approved no ledger + runner aplica no worktree do pilar + recibo no vault. Irreversível (merge/push/delete) NUNCA passa por aqui.</p></div>';
}
function renderAll(){
  renderAprovar(DATA);
  renderChrome(DATA);
  renderGeral(DATA); renderP1(DATA); renderP3(DATA); renderP6(DATA); renderP4(DATA);
  renderPill();
  animateBars();
}

/* ================= tabs / deep-link ================= */
function showTab(name){
  const valid = ["geral","p1","p3","p6","p4","aprovar"];
  if(!valid.includes(name)) name = "geral";
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on", a.dataset.tab===name));
  valid.forEach(v=>document.getElementById("pane-"+v).classList.toggle("on", v===name));
  animateBars();
}
window.addEventListener("hashchange", ()=>showTab(location.hash.replace("#","")));

/* ================= modo vivo: poll 5 s ================= */
let pollTimer = null;
async function poll(){
  try{
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 3500);
    const r = await fetch(ENDPOINT, {signal: ctl.signal, cache:"no-store"});
    clearTimeout(t);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    if(!j || typeof j !== "object" || !j.device) throw new Error("payload sem schema esperado");
    const changed = JSON.stringify(j)!==JSON.stringify(DATA) || MODE!=="live";
    DATA = j; MODE = "live";
    if(changed) renderAll();
    else renderPill();
  }catch(e){
    const was = MODE;
    MODE = "snapshot";
    if(was!=="snapshot"){ DATA = BASE_SNAPSHOT; renderAll(); }
    else renderPill();
  }
  pollTimer = setTimeout(poll, POLL_MS);
}

/* ================= endpoint editável ================= */
document.getElementById("src-pill").addEventListener("click", ()=>{
  const row = document.getElementById("endpoint-row");
  row.classList.toggle("open");
  document.getElementById("endpoint-input").value = ENDPOINT;
});
document.getElementById("endpoint-apply").addEventListener("click", ()=>{
  const v = document.getElementById("endpoint-input").value.trim();
  if(v){ ENDPOINT = v; }               /* persistência em variável JS */
  document.getElementById("endpoint-row").classList.remove("open");
  clearTimeout(pollTimer); poll();
});
document.getElementById("endpoint-input").addEventListener("keydown", e=>{
  if(e.key==="Enter") document.getElementById("endpoint-apply").click();
});

/* ================= boot ================= */
renderAll();
showTab(location.hash.replace("#",""));
poll();
</script>
