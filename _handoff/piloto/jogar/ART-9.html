        bottom: -6px;

        border: 6px solid transparent;

        border-bottom: 0;

        bottom: 8px;
        right: 10px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        font-variant-numeric: tabular-nums;
      }
    </style>
