        padding: 8px;
        border-radius: 12px;

        height: 58px;

        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        transition:

          border-color 0.08s ease;
      }

        font-weight: 700;
        margin-bottom: 4px;
        opacity: 0.85;
      }

        transform: translateY(-4px) scale(1.06);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      }

        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 10;

      }

        color: #ffe9a8;

        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;

        font-size: 11px;
