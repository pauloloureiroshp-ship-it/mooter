<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mooter · Onboarding</title>
  <link rel="icon" href="../assets/logos/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    html, body { margin:0; padding:0; background:#0B0A09; color:#F2EDE6; }
    @keyframes mblink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes mpulse { 0%,100%{opacity:0.4; transform:scale(0.9)} 50%{opacity:1; transform:scale(1.1)} }
    @keyframes crookSway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
    input[type=range] { height:4px; }
    .ab-mount { display:flex; flex-direction:column; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../mooter-v1-shared.jsx"></script>
  <script type="text/babel" src="../mooter-v1-marketing.jsx"></script>
  <script type="text/babel" src="../mooter-v1-onboarding.jsx"></script>
  <script type="text/babel" src="../mooter-v1-app.jsx"></script>
  <script type="text/babel" src="../mooter-v1-iter1.jsx"></script>
  <script type="text/babel" src="../site/_layout.jsx"></script>
  <script type="text/babel" src="../mooter-v1-cmdk.jsx"></script>

  <script type="text/babel">

    const { OnbStep1, OnbStep2, OnbStep3, OnbStep4, OnbStep5 } = window;
    const params = new URLSearchParams(window.location.search);
    const step = parseInt(params.get('step') || '1', 10);
    const Step = [OnbStep1, OnbStep2, OnbStep3, OnbStep4, OnbStep5][Math.max(0, Math.min(4, step-1))];

    // wire back/continue: dispatch on history popstate + delegated click
    window.MOOTER_SET_ROUTES({
      'onb-prev': step > 1 ? `?step=${step-1}` : 'index.html',
      'onb-next': step < 5 ? `?step=${step+1}` : 'app/dashboard.html',
      dashboard: 'app/dashboard.html',
    });

    // Footer/Back buttons in OnbShell use <Btn> without href — wire via event delegation
    document.addEventListener('click', (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      const txt = (t.textContent || '').trim().toLowerCase();
      if (txt.startsWith('continue') || txt.includes('go to dashboard') || txt.includes('open claude')) {
        e.preventDefault(); window.location = step < 5 ? `?step=${step+1}` : 'app/dashboard.html';
      } else if (txt.startsWith('← back')) {
        e.preventDefault(); window.location = step > 1 ? `?step=${step-1}` : 'index.html';
      }
    });

    ReactDOM.createRoot(document.getElementById('root')).render(<div style={{minHeight:'100vh'}}><Step/></div>);
  </script>
</body>
</html>
